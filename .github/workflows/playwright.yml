name: Playwright Tests

on:
  workflow_dispatch:              # Manuell körning från Actions-fliken
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  repository_dispatch:            # Triggas från REST: /repos/.../dispatches
    types: [ run_e2e ]

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # Hämta payload från repository_dispatch (fallbacks för andra triggers)
    env:
      # Payload keys (fall back till standardvärden när de saknas)
      RUN_REF: ${{ github.event.client_payload.ref || github.ref }}
      RUN_SUITE: ${{ github.event.client_payload.suite || 'Login' }}   # kör 'Login' som default
      RUN_ENV: ${{ github || 'https://hoff.is/login/' }}      RUN_ENV: ${{ github.event.client_payload.env || 'tst' }}

    steps:
      - name: Checkout (ref from payload if present)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RUN_REF }}

      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Show inputs
        run: |
          echo "Ref: $RUN_REF"
          echo "Suite: $RUN_SUITE"
          echo "Env: $RUN_ENV"
          echo "Base URL: $BASE_URL"

      - name: Run Playwright tests (suite via --grep)
        env:
          BASE_URL: ${{ env.BASE_URL }}
          TEST_ENV: ${{ env.RUN_ENV }}
        run: |
          # Exempel: sätt baseURL via Playwright config eller via env i dina test
          # Kör enbart matcher för RUN_SUITE (case-sensitive pattern)
          npx playwright test --grep "${{ env.RUN_SUITE }}" --reporter=html

      - name: Upload HTML report as artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-html-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30

  deploy-report:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ always() }} # Kör även om testerna failar
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Hämta senaste artefaktens namn dynamiskt om du vill, men här använder vi run_id
          name: playwright-html-report-${{ github.run_id }}
          path: ./playwright-report

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
      # Exempel på baseUrl beroende på env (anpassa efter din miljö)
